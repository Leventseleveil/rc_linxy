server:
  port: 8080

spring:
  application:
    name: notify-service
  datasource:
    # 默认 SQLite 单文件。生产建议换 MySQL/PostgreSQL，仅需改 url/driver 并复用同一 schema。
    url: jdbc:sqlite:./data/notify.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8

notify:
  # 供应商定义文件目录（每个供应商一个 yaml：url 模板 / header 模板 / body 模板 / 重试策略）
  suppliers-dir: ./suppliers
  delivery:
    # 扫描间隔：多久捞一批"到期待投递"的通知
    poll-interval-ms: 1000
    # 每轮最多捞取条数（防止积压时打爆外部 API）
    batch-size: 100
    # 单个供应商并发投递 worker 数
    workers-per-supplier: 4
    # 请求超时
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  retry:
    # 退避序列（秒），借鉴 RocketMQ delayLevel 思路：固定梯度、可预测、避免惊群
    backoff-seconds: 1,5,10,30,60,300,900
    # 出站请求携带的去重头（vendor 可据此幂等）
    idempotency-header: X-Notify-Dedup-Key
  security:
    # 入向 API 鉴权：Bearer token 白名单（演示用；生产建议接内部统一认证）
    api-tokens: "dev-token-1,dev-token-2"

logging:
  level:
    com.linxy.notify: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
